name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: petfold/swarmfs # test against swarmfs main (co-evolving); releases are on PyPI
          path: swarmfs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./swarmfs -e ".[test]"
      - run: pytest tests # live tests self-skip without SWARMLITE_TEST_* env; scoped so the swarmfs checkout is not collected

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test # zero dependencies — no npm install needed
        working-directory: js
