name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: petfold/swarmfs # test against swarmfs main (co-evolving); releases are on PyPI
          path: swarmfs
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ./swarmfs -e ".[test]"
      # live tests self-skip without SWARMLITE_TEST_*; scoped so the swarmfs
      # checkout is not collected
      - run: pytest tests

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test # zero dependencies — no npm install needed
        working-directory: js
