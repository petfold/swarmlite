name: Publish to PyPI

# Token-less publishing via PyPI Trusted Publishers: PyPI trusts this
# exact repo+workflow (configured at pypi.org/manage/account/publishing/),
# so no credentials are stored anywhere. Pushing a v* tag publishes;
# workflow_dispatch is there to retry a failed run without a new tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Unlike tests.yml, this resolves swarmfs from PyPI rather than checking out
      # its main branch: this job gates a real release, so it must exercise what
      # `pip install swarmlite` actually gives a user.
      - run: pip install -e ".[test]"
      # A v* tag publishes irreversibly — PyPI never allows re-uploading a
      # version, only yanking. Run the suite first so a tag cannot ship a red
      # build. Live tests self-skip without SWARMLITE_TEST_*.
      - run: pytest tests
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test # zero dependencies — no npm install needed
        working-directory: js

  publish:
    needs: [build, js]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC handshake with PyPI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
