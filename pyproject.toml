[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmlite"
version = "0.2.1"
description = "Verifiable serverless SQLite hosting on Ethereum Swarm: a read-only VFS over swarmfs plus a publish helper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Peter Foldiak" }]
keywords = ["swarm", "ethereum", "sqlite", "vfs", "bee", "bzz", "serverless"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "apsw>=3.45",
    "swarmfs>=0.1.0",
    "fsspec>=2023.6.0",
]

[project.optional-dependencies]
feeds = [
    # feed publishing/resolution pulls in swarmfs's feeds extra
    "swarmfs[feeds]",
]
test = [
    "pytest>=7",
    "swarmlite[feeds]",
]

[project.scripts]
swarmlite = "swarmlite.cli:main"

[project.urls]
Homepage = "https://github.com/petfold/swarmlite"
Repository = "https://github.com/petfold/swarmlite"
Issues = "https://github.com/petfold/swarmlite/issues"

[tool.hatch.build.targets.wheel]
packages = ["swarmlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
