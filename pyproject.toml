[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmlite"
version = "0.3.1"
description = "Verifiable serverless SQLite hosting on Ethereum Swarm: a read-only VFS over swarmfs plus a publish helper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Peter Foldiak" }]
keywords = ["swarm", "ethereum", "web3", "decentralized", "sqlite", "vfs", "bee", "bzz", "serverless"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "apsw>=3.45",
    # 0.4.0 brought redundancy-aware batch sizing, topup/dilute, bucket
    # occupancy (`swarmlite stamps` and plan_batch need all of it); the
    # 0.7.1 floor additionally carries swarmfs's fix for the
    # transaction-exit crash on fsspec < 2024.3.0 — publish() runs inside
    # `with fs.transaction:`, and LTS systems really do run distro fsspec
    # of that vintage (pip won't upgrade a dependency that already
    # satisfies a floor). publish(encrypt=True) needs swarmfs >= 0.9 (the
    # encrypted-storage release) — guarded at runtime with a clear error
    # rather than raising the floor for everyone.
    "swarmfs>=0.7.1",
    "fsspec>=2023.6.0",
]

[project.optional-dependencies]
feeds = [
    # feed publishing/resolution pulls in swarmfs's feeds extra
    "swarmfs[feeds]",
]
test = [
    "pytest>=7",
    "swarmlite[feeds]",
]

[project.scripts]
swarmlite = "swarmlite.cli:main"

[project.urls]
Homepage = "https://github.com/petfold/swarmlite"
Repository = "https://github.com/petfold/swarmlite"
Issues = "https://github.com/petfold/swarmlite/issues"

[tool.hatch.build.targets.wheel]
packages = ["swarmlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
